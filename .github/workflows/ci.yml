# The same four gates that run locally, so main's health does not depend on
# anyone remembering to run them. The release install gate stays local — it
# needs the private scrub denylist.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The built web edition and the extension's store build in a real Chromium
  # (e2e/), the network beyond the site faked in each test.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run web:build
      - run: CVFORGE_SITE=https://rumbo.korven.dev/app/ npm run web:extension
      - run: rm -rf web/extension/dist-store && cp -R web/extension/dist web/extension/dist-store
      - run: npm run e2e

  seguridad:
    name: Seguridad
    uses: gdberysan/.github/.github/workflows/security.yml@v1
    permissions:
      contents: read
      # gitleaks-action lee los commits del PR en eventos pull_request
      pull-requests: read
