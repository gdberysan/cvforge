<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E131B" />
  <title>CVForge</title>
  <style>
    /* Tokens from styles/korven/colors.css — this page cannot load the app's CSS. */
    :root { --bg: #0E131B; --ink: #EFF3F8; --muted: #97A3B2; --accent: #FF8A2B; --on-accent: #0E131B; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #F5F7FA; --ink: #0E131B; --muted: #4B5668; --accent: #A8500F; --on-accent: #F5F7FA; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, sans-serif; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
    main { max-width: 32rem; text-align: center; }
    p { color: var(--muted); }
    button { margin-top: 16px; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 0;
             background: var(--accent); color: var(--on-accent); font: 600 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Tu Mac no responde</h1>
    <p>CVForge no está encendido en tu Mac, o no la puedes alcanzar desde aquí. Tus datos siguen ahí; reintenta cuando esté encendido.</p>
    <p lang="en">CVForge isn't running on your Mac, or the Mac can't be reached from here. Your data is safe there — try again once it's on.</p>
    <button type="button" onclick="location.reload()">Reintentar · Retry</button>
  </main>
</body>
</html>
